name: notegym
description: "NoteGym - Tu Compañero de Entrenamiento Personal"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  shared_preferences: ^2.3.2

  # Excel / File handling
  excel: ^4.0.3
  file_picker: ^8.1.2
  share_plus: ^10.0.0
  path_provider: ^2.1.4

  # Charts
  fl_chart: ^0.69.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2

  # Icons
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
